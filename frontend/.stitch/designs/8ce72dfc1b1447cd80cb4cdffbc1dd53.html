<!DOCTYPE html><html lang="en" class="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#191c1e",
                    "secondary-fixed-dim": "#bec6e0",
                    "on-surface-variant": "#464555",
                    "tertiary-container": "#006e4b",
                    "surface-container-low": "#f2f4f6",
                    "surface-variant": "#e0e3e5",
                    "secondary-fixed": "#dae2fd",
                    "on-primary-fixed": "#0f0069",
                    "on-secondary-container": "#5c647a",
                    "on-primary-container": "#dad7ff",
                    "primary": "#3525cd",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "surface-dim": "#d8dadc",
                    "outline": "#777587",
                    "on-secondary-fixed": "#131b2e",
                    "primary-container": "#4f46e5",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#67f4b7",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#3f465c",
                    "inverse-surface": "#2d3133",
                    "surface": "#f7f9fb",
                    "on-tertiary-fixed": "#002113",
                    "surface-container-highest": "#e0e3e5",
                    "secondary": "#565e74",
                    "on-tertiary": "#ffffff",
                    "background": "#f7f9fb",
                    "surface-container-high": "#e6e8ea",
                    "tertiary-fixed": "#6ffbbe",
                    "inverse-on-surface": "#eff1f3",
                    "primary-fixed": "#e2dfff",
                    "surface-container": "#eceef0",
                    "tertiary": "#005338",
                    "inverse-primary": "#c3c0ff",
                    "on-error-container": "#93000a",
                    "secondary-container": "#dae2fd",
                    "primary-fixed-dim": "#c3c0ff",
                    "surface-tint": "#4d44e3",
                    "on-primary": "#ffffff",
                    "on-surface": "#191c1e",
                    "outline-variant": "#c7c4d8",
                    "surface-bright": "#f7f9fb",
                    "on-primary-fixed-variant": "#3323cc",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-tertiary-fixed-variant": "#005236"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "xl": "64px",
                    "base": "4px",
                    "xs": "8px",
                    "margin-mobile": "16px",
                    "sm": "16px",
                    "margin-desktop": "48px",
                    "gutter": "24px",
                    "lg": "40px"
            },
            "fontFamily": {
                    "headline-lg": ["Geist"],
                    "label-sm": ["Geist"],
                    "headline-lg-mobile": ["Geist"],
                    "body-lg": ["Geist"],
                    "display-lg": ["Geist"],
                    "headline-md": ["Geist"],
                    "body-md": ["Geist"],
                    "label-md": ["Geist"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    }catch(_e){}</script></head><body class="bg-surface min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Top Navigation Anchor (Hidden shell logic check: Auth page usually hides full nav, but logo is kept for brand) -->
<header class="fixed top-0 left-0 w-full px-6 h-16 flex items-center justify-center pointer-events-none">
<h1 class="font-headline-md text-headline-md font-bold text-primary">ExamAI</h1>
</header>
<main class="w-full max-w-md px-margin-mobile md:px-0">
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-3xl p-lg shadow-soft-level-1 border border-surface-container-high relative z-10">
<!-- Role Selector Toggle -->
<div class="mb-lg">
<div class="relative bg-surface-container flex p-1 rounded-full items-center cursor-pointer select-none" id="roleToggle">
<!-- Sliding Pill -->
<div id="togglePill" class="absolute h-[calc(100%-8px)] w-[calc(50%-4px)] bg-surface-container-lowest rounded-full shadow-sm toggle-bg left-1"></div>
<button type="button" onclick="setRole('Student')" class="relative z-10 w-1/2 py-2 font-label-md text-label-md text-center transition-colors duration-300 text-on-surface" id="btnStudent">
                        Student
                    </button>
<button type="button" onclick="setRole('Teacher')" class="relative z-10 w-1/2 py-2 font-label-md text-label-md text-center transition-colors duration-300 text-on-secondary-container" id="btnTeacher">
                        Teacher
                    </button>
</div>
</div>
<div class="text-center mb-lg">
<h2 class="font-headline-md text-headline-md text-on-background mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your academic companion</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-sm" onsubmit="event.preventDefault();">
<div>
<label for="email" class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Email Address</label>
<input type="email" id="email" placeholder="alex.rivers@university.edu" class="w-full h-12 px-4 rounded-xl border-surface-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md text-body-md">
</div>
<div class="relative">
<div class="flex justify-between items-center mb-xs ml-1">
<label for="password" class="font-label-md text-label-md text-on-surface-variant">Password</label>
<a href="#" class="font-label-sm text-label-sm text-primary hover:underline">Forgot Password?</a>
</div>
<div class="relative">
<input type="password" id="password" placeholder="••••••••" class="w-full h-12 px-4 rounded-xl border-surface-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md text-body-md pr-12">
<button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-sm">
<button type="submit" id="submitBtn" class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-xl hover:bg-primary-container active:scale-95 transition-all shadow-md shadow-primary/10">
                        Continue as Student
                    </button>
</div>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a href="#" class="text-primary font-bold hover:underline">Create an account</a>
</p>
</div>
</div>
<!-- Secondary Decorative Element: Atmospheric Quote -->
<div class="mt-md text-center px-lg opacity-60">
<p class="italic font-body-md text-body-md text-on-surface-variant">
                "Education is the passport to the future, for tomorrow belongs to those who prepare for it today."
            </p>
</div>
</main>
<!-- Background Decoration: Subtle Abstract Graphic -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<!-- Abstract gradient blob 1 -->
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<!-- Abstract gradient blob 2 -->
<div class="absolute bottom-[5%] right-[0%] w-[30%] h-[30%] bg-tertiary-fixed-dim/10 rounded-full blur-[80px]"></div>
</div>
<script>
        let currentRole = 'Student';

        function setRole(role) {
            currentRole = role;
            const togglePill = document.getElementById('togglePill');
            const submitBtn = document.getElementById('submitBtn');
            const btnStudent = document.getElementById('btnStudent');
            const btnTeacher = document.getElementById('btnTeacher');

            if (role === 'Student') {
                togglePill.style.left = '4px';
                togglePill.style.transform = 'translateX(0)';
                btnStudent.classList.add('text-on-surface');
                btnStudent.classList.remove('text-on-secondary-container');
                btnTeacher.classList.remove('text-on-surface');
                btnTeacher.classList.add('text-on-secondary-container');
                submitBtn.textContent = 'Continue as Student';
            } else {
                // Approximate 50% shift
                togglePill.style.left = 'calc(50% + 0px)';
                btnTeacher.classList.add('text-on-surface');
                btnTeacher.classList.remove('text-on-secondary-container');
                btnStudent.classList.remove('text-on-surface');
                btnStudent.classList.add('text-on-secondary-container');
                submitBtn.textContent = 'Continue as Teacher';
            }

            // Micro-interaction: Active scale effect
            submitBtn.classList.add('scale-95');
            setTimeout(() => {
                submitBtn.classList.remove('scale-95');
            }, 100);
        }

        // Initialize state
        setRole('Student');
    </script>
</body></html>
