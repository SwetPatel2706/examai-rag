<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body { font-family: 'Geist', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        
        /* Flashcard Flip Animation */
        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* Ambient background effect */
        .ambient-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            border-radius: 50%;
            animation: float 20s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 100px); }
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden min-h-screen relative">
<!-- Ambient Background -->
<div class="ambient-blob bg-primary-fixed top-[-100px] left-[-100px]"></div>
<div class="ambient-blob bg-tertiary-fixed bottom-[-100px] right-[-100px]" style="animation-delay: -5s;"></div>
<!-- Focused Top Bar -->
<header class="w-full h-16 bg-white/60 backdrop-blur-md flex flex-col justify-center sticky top-0 z-50">
<div class="px-md md:px-margin-desktop flex justify-between items-center w-full">
<h1 class="font-headline-md text-headline-md text-on-surface">Graph Theory</h1>
<button aria-label="Close Study Session" class="p-base hover:bg-surface-container rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Progress Bar Container -->
<div class="w-full bg-surface-container-highest h-1 mt-auto">
<div class="bg-primary h-full transition-all duration-500 ease-out" id="progress-bar" style="width: 20%;"></div>
</div>
</header>
<!-- Main Study Content -->
<main class="flex flex-col items-center justify-center min-h-[calc(100vh-64px)] px-margin-mobile">
<!-- Progress Text -->
<div class="mb-md text-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Card 4 of 20</span>
</div>
<!-- Flashcard -->
<div class="card-container w-full max-w-[500px] h-[360px] relative group">
<div class="card-inner w-full h-full relative" id="flashcard" onclick="toggleFlip()">
<!-- Front Side -->
<div class="card-front bg-white rounded-2xl shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)] p-lg flex flex-col items-center justify-center text-center border border-surface-variant">
<p class="font-headline-md text-headline-md text-on-surface leading-snug">What is a bipartite graph?</p>
<div class="absolute bottom-md right-md flex items-center gap-xs opacity-40 group-hover:opacity-100 transition-opacity">
<span class="font-label-sm text-label-sm text-on-surface-variant">Tap to flip</span>
<span class="material-symbols-outlined text-sm">sync</span>
</div>
</div>
<!-- Back Side -->
<div class="card-back bg-white rounded-2xl shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)] p-lg flex flex-col items-center justify-center text-center border border-primary-fixed overflow-y-auto">
<p class="font-body-lg text-body-lg text-on-surface-variant mb-md">
                        A graph whose vertices can be divided into two disjoint sets <span class="font-bold text-primary">U</span> and <span class="font-bold text-primary">V</span> such that every edge connects a vertex in U to one in V.
                    </p>
<div class="w-16 h-16 bg-surface-container-low rounded-lg flex items-center justify-center">
<img class="w-12 h-12" data-alt="A clean mathematical diagram showing a bipartite graph with two sets of nodes colored in soft indigo and emerald, connected by thin gray lines. The style is minimalist and academic, using a light mode color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6GIxSMFgZPRUlPSrMoL3MwvQfDSSKoAUxtNdkGOX9uJl8uVLNAp7O2KclNqXSxWRfZQRo8QShLl3TW5uBkmSurQgx55rMEBwUfTeHoRUllHTnmPtDBSJi-orQiZGR2BmjRf5PgLcjHvUZNGGQEQnDbbL4SMDL79dUhZgXLIt2UdPlY5xAunzttlHf4tXEOg2Z_2QTEbveNgz8BE8Wm-s5BZ6FcwLjaCYfxiTt_l8rOR6JamlzDkTDF2tFm_r3DKOFO82VYLRDg2A"/>
</div>
</div>
</div>
</div>
<!-- Navigation & Actions -->
<div class="mt-lg flex flex-col items-center gap-md w-full max-w-[500px]">
<!-- Default Navigation (Visible always) -->
<div class="flex items-center gap-md">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-sm border border-surface-variant hover:bg-surface-container-low transition-all active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-sm border border-surface-variant hover:bg-surface-container-low transition-all active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Self-Assessment (Hidden until flipped) -->
<div class="flex gap-sm w-full opacity-0 pointer-events-none translate-y-4 transition-all duration-300" id="assessment-tools">
<button class="flex-1 py-md bg-orange-100/50 text-orange-800 font-label-md text-label-md rounded-full hover:bg-orange-100 transition-colors active:scale-95">
                    Still Learning
                </button>
<button class="flex-1 py-md bg-tertiary-fixed text-tertiary font-label-md text-label-md rounded-full hover:bg-tertiary-fixed-dim transition-colors active:scale-95">
                    Got It
                </button>
</div>
</div>
</main>
<script>
        let isFlipped = false;
        const card = document.getElementById('flashcard');
        const assessment = document.getElementById('assessment-tools');

        function toggleFlip() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('is-flipped');
                // Show assessment buttons after flip
                assessment.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                assessment.classList.add('opacity-100', 'translate-y-0');
            } else {
                card.classList.remove('is-flipped');
                // Optional: hide them again when flipping back
                // assessment.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleFlip();
            }
            if (e.code === 'ArrowRight') {
                // Logic for next card
            }
            if (e.code === 'ArrowLeft') {
                // Logic for previous card
            }
        });

        // Simple progress update logic simulation
        window.addEventListener('load', () => {
            const bar = document.getElementById('progress-bar');
            bar.style.width = '20%'; // Example: Card 4 of 20
        });
    </script>
</body></html>
